<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Moderno Vertical</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Oxanium:wght@500;600;700;800&display=swap">
<style>
  /* VISTA PREVIA - Moderno Vertical. Lee ./overlay_data.json (no modifica nada). */
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: 'Inter', sans-serif; color: #fff; padding: 28px; }
  :root { --tier: 46, 204, 113; --win: 0, 163, 255; --loss: 255, 27, 72; }
  @keyframes entrar { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .card { width: 230px; padding: 18px 18px 16px; border-radius: 18px; text-align: center; animation: entrar .5s ease-out both;
    background: radial-gradient(120% 70% at 50% 0%, rgba(var(--tier), .35), rgba(14,16,22,.9) 60%);
    border: 1px solid rgba(var(--tier), .4); box-shadow: 0 10px 30px rgba(0,0,0,.5), 0 0 24px rgba(var(--tier), .2); }
  .emb { width: 110px; height: 110px; object-fit: contain; margin: -6px auto 0; display: block; filter: drop-shadow(0 4px 12px rgba(var(--tier), .6)); }
  .name { margin-top: 4px; font-family: 'Rajdhani', sans-serif; font-size: 24px; font-weight: 700; line-height: 1; }
  .name small { font-size: 15px; color: rgba(255,255,255,.45); margin-left: 2px; }
  .tier { margin-top: 6px; font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 700; color: rgb(var(--tier)); letter-spacing: .08em; }
  .lpbar { margin: 10px 0 4px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
  .lpbar span { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, rgba(var(--tier), .5), rgb(var(--tier))); transition: width .8s ease; }
  .lptxt { font-size: 12px; font-weight: 600; color: rgba(255,255,255,.7); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .stat { padding: 8px 0 7px; border-radius: 10px; background: rgba(255,255,255,.05); }
  .stat b { display: block; font-family: 'Rajdhani', sans-serif; font-size: 24px; line-height: 1; }
  .stat small { font-size: 9px; font-weight: 700; letter-spacing: .12em; color: rgba(255,255,255,.5); }
  .stat.w b { color: rgb(var(--win)); } .stat.l b { color: rgb(var(--loss)); }
  .hist { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 14px; }
  .m { animation: entrar .35s ease-out both; }
  .m img { width: 36px; height: 36px; border-radius: 50%; display: block; margin: 0 auto; border: 2px solid; }
  .m.win img { border-color: rgb(var(--win)); } .m.loss img { border-color: rgb(var(--loss)); filter: saturate(.5) brightness(.85); }
  .m span { display: block; margin-top: 2px; font-size: 9px; font-weight: 700; color: rgba(255,255,255,.55); }
  .m span.mvp { color: #ffc400; } .m span.ace { color: #c084fc; }

</style>
</head>
<body>

<div class="card">
  <img id="emb" class="emb" alt="">
  <div class="name"><span id="name">-</span><small id="tag"></small></div>
  <div class="tier" id="tier">-</div>
  <div class="lpbar" id="lpbar"><span id="bar"></span></div>
  <div class="lptxt" id="lp">0 LP</div>
  <div class="stats">
    <div class="stat w"><b id="w">0</b><small>WINS</small></div>
    <div class="stat l"><b id="l">0</b><small>LOSSES</small></div>
  </div>
  <div class="hist" id="hist"></div>
</div>

<script>

  const COLORES = {
    IRON:"161,157,148", BRONZE:"205,127,50", SILVER:"189,195,199", GOLD:"241,196,15",
    PLATINUM:"26,188,156", EMERALD:"46,204,113", DIAMOND:"52,152,219",
    MASTER:"224,64,251", GRANDMASTER:"231,76,60", CHALLENGER:"243,156,18"
  };
  const SIN_DIVISION = ["MASTER", "GRANDMASTER", "CHALLENGER"];
  const $ = id => document.getElementById(id);

  // Convierte el historial_html que ya genera el tracker en una lista simple
  function leerHistorial(html) {
    const doc = new DOMParser().parseFromString(html || "", "text/html");
    return [...doc.body.children].map(el => {
      const img = el.querySelector("img");
      const borde = el.querySelector('[style*="box-shadow"]');
      const estilo = borde ? borde.getAttribute("style") : "";
      const etiqueta = ((el.querySelector("span") || {}).textContent || "").trim();
      return { img: img ? img.getAttribute("src") : "", win: estilo.includes("0, 163, 255"), etiqueta };
    }).filter(p => p.img);
  }
  function claseEtiqueta(e) { return e === "MVP" ? "mvp" : e === "ACE" ? "ace" : ""; }

  let ultimoHist = null;
  async function actualizar() {
    try {
      const res = await fetch("./overlay_data.json?v=" + Date.now());
      if (!res.ok) return;
      const d = await res.json();
      const tier = (d.tier || "EMERALD").toUpperCase();
      const sinDiv = SIN_DIVISION.includes(tier);
      document.documentElement.style.setProperty("--tier", COLORES[tier] || "255,255,255");
      const info = {
        tier, sinDiv,
        tierTexto: tier + (sinDiv ? "" : " " + d.rank),
        tierCorto: tier.charAt(0) + tier.slice(1).toLowerCase() + (sinDiv ? "" : " " + d.rank),
        icono: `https://ddragon.leagueoflegends.com/cdn/${d.latest_patch}/img/profileicon/${d.profile_icon_id}.png`,
        emblema: `https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-${tier.toLowerCase()}.png`,
        pct: Math.max(0, Math.min(100, d.lp))
      };
      render(d, info);
      if (d.historial_html !== ultimoHist) {
        ultimoHist = d.historial_html;
        renderHistorial(leerHistorial(d.historial_html));
      }
    } catch (e) { console.error(e); }
  }
  function setText(id, v) { const el = $(id); if (el) el.textContent = v; }
  function setSrc(id, v) { const el = $(id); if (el && el.getAttribute("src") !== v) el.src = v; }
  actualizar();
  setInterval(actualizar, 3000);


  function render(d, i) {
    setSrc("emb", i.emblema);
    setText("name", d.riot_id || "-"); setText("tag", d.riot_tag ? "#" + d.riot_tag : "");
    setText("tier", i.tierTexto);
    $("lpbar").style.display = i.sinDiv ? "none" : "block";
    $("bar").style.width = i.pct + "%";
    setText("lp", i.sinDiv ? d.lp + " LP" : d.lp + " / 100 LP");
    setText("w", d.wins_hoy); setText("l", d.losses_hoy);
  }
  function renderHistorial(p) {
    $("hist").innerHTML = p.map((m, k) => `<div class="m ${m.win ? "win" : "loss"}" style="animation-delay:${k*.05}s">
      <img src="${m.img}" alt=""><span class="${claseEtiqueta(m.etiqueta)}">${m.etiqueta}</span></div>`).join("");
  }

</script>
</body>
</html>
