<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Moderno Anillo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Oxanium:wght@500;600;700;800&display=swap">
<style>
  /* VISTA PREVIA - Moderno Anillo. Lee ./overlay_data.json (no modifica nada). */
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: 'Inter', sans-serif; color: #fff; padding: 28px; }
  :root { --tier: 46, 204, 113; --win: 0, 163, 255; --loss: 255, 27, 72; }
  @keyframes entrar { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .card { display: inline-flex; align-items: center; gap: 18px; padding: 14px 22px 14px 14px; border-radius: 60px 20px 20px 60px;
    animation: entrar .5s ease-out both;
    background: linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.04)); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.18); box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .ring { position: relative; width: 96px; height: 96px; flex-shrink: 0; }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 6; }
  .ring .bg { stroke: rgba(255,255,255,.12); }
  .ring .fg { stroke: rgb(var(--tier)); stroke-linecap: round; transition: stroke-dashoffset .9s ease; filter: drop-shadow(0 0 4px rgba(var(--tier), .8)); }
  .ring .icon { position: absolute; inset: 11px; width: 74px; height: 74px; border-radius: 50%; }
  .ring .emb { position: absolute; width: 40px; height: 40px; left: 50%; bottom: -14px; transform: translateX(-50%); object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
  .name { font-family: 'Rajdhani', sans-serif; font-size: 24px; font-weight: 700; line-height: 1; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .name small { font-size: 15px; color: rgba(255,255,255,.55); margin-left: 3px; }
  .row { display: flex; align-items: baseline; gap: 10px; margin-top: 4px; }
  .tier { font-family: 'Rajdhani', sans-serif; font-size: 17px; font-weight: 700; color: rgb(var(--tier)); letter-spacing: .06em; }
  .lp { font-family: 'Rajdhani', sans-serif; font-size: 30px; font-weight: 700; line-height: 1; }
  .lp small { font-size: 14px; color: rgba(255,255,255,.6); margin-left: 2px; }
  .ses { display: inline-flex; gap: 6px; margin-left: 6px; }
  .ses span { padding: 3px 8px; border-radius: 20px; font-size: 12px; font-weight: 700; }
  .ses .w { background: rgba(var(--win), .25); color: #7fd0ff; } .ses .l { background: rgba(var(--loss), .22); color: #ff8aa0; }
  .hist { display: flex; gap: 4px; margin-top: 10px; }
  .m { position: relative; animation: entrar .35s ease-out both; }
  .m img { width: 28px; height: 28px; border-radius: 50%; display: block; }
  .m.loss img { filter: grayscale(.6) brightness(.8); }
  .m::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid rgba(20,22,30,.9); }
  .m.win::after { background: rgb(var(--win)); } .m.loss::after { background: rgb(var(--loss)); }
  .m.mvp img { box-shadow: 0 0 0 2px #ffc400; } .m.ace img { box-shadow: 0 0 0 2px #c084fc; }

</style>
</head>
<body>

<div class="card">
  <div class="ring">
    <svg viewBox="0 0 96 96"><circle class="bg" cx="48" cy="48" r="44"/><circle class="fg" id="fg" cx="48" cy="48" r="44"/></svg>
    <img id="icon" class="icon" alt="">
    <img id="emb" class="emb" alt="">
  </div>
  <div>
    <div class="name"><span id="name">-</span><small id="tag"></small></div>
    <div class="row"><span class="lp"><span id="lp">0</span><small>LP</small></span><span class="tier" id="tier">-</span>
      <span class="ses"><span class="w" id="w">0W</span><span class="l" id="l">0L</span></span></div>
    <div class="hist" id="hist"></div>
  </div>
</div>

<script>

  const COLORES = {
    IRON:"161,157,148", BRONZE:"205,127,50", SILVER:"189,195,199", GOLD:"241,196,15",
    PLATINUM:"26,188,156", EMERALD:"46,204,113", DIAMOND:"52,152,219",
    MASTER:"224,64,251", GRANDMASTER:"231,76,60", CHALLENGER:"243,156,18"
  };
  const SIN_DIVISION = ["MASTER", "GRANDMASTER", "CHALLENGER"];
  const $ = id => document.getElementById(id);

  // Convierte el historial_html que ya genera el tracker en una lista simple
  function leerHistorial(html) {
    const doc = new DOMParser().parseFromString(html || "", "text/html");
    return [...doc.body.children].map(el => {
      const img = el.querySelector("img");
      const borde = el.querySelector('[style*="box-shadow"]');
      const estilo = borde ? borde.getAttribute("style") : "";
      const etiqueta = ((el.querySelector("span") || {}).textContent || "").trim();
      return { img: img ? img.getAttribute("src") : "", win: estilo.includes("0, 163, 255"), etiqueta };
    }).filter(p => p.img);
  }
  function claseEtiqueta(e) { return e === "MVP" ? "mvp" : e === "ACE" ? "ace" : ""; }

  let ultimoHist = null;
  async function actualizar() {
    try {
      const res = await fetch("./overlay_data.json?v=" + Date.now());
      if (!res.ok) return;
      const d = await res.json();
      const tier = (d.tier || "EMERALD").toUpperCase();
      const sinDiv = SIN_DIVISION.includes(tier);
      document.documentElement.style.setProperty("--tier", COLORES[tier] || "255,255,255");
      const info = {
        tier, sinDiv,
        tierTexto: tier + (sinDiv ? "" : " " + d.rank),
        tierCorto: tier.charAt(0) + tier.slice(1).toLowerCase() + (sinDiv ? "" : " " + d.rank),
        icono: `https://ddragon.leagueoflegends.com/cdn/${d.latest_patch}/img/profileicon/${d.profile_icon_id}.png`,
        emblema: `https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-${tier.toLowerCase()}.png`,
        pct: Math.max(0, Math.min(100, d.lp))
      };
      render(d, info);
      if (d.historial_html !== ultimoHist) {
        ultimoHist = d.historial_html;
        renderHistorial(leerHistorial(d.historial_html));
      }
    } catch (e) { console.error(e); }
  }
  function setText(id, v) { const el = $(id); if (el) el.textContent = v; }
  function setSrc(id, v) { const el = $(id); if (el && el.getAttribute("src") !== v) el.src = v; }
  actualizar();
  setInterval(actualizar, 3000);


  const CIRC = 2 * Math.PI * 44;
  function render(d, i) {
    setSrc("icon", i.icono); setSrc("emb", i.emblema);
    setText("name", d.riot_id || "-"); setText("tag", d.riot_tag ? "#" + d.riot_tag : "");
    setText("tier", i.tierTexto); setText("lp", d.lp);
    setText("w", d.wins_hoy + "W"); setText("l", d.losses_hoy + "L");
    const fg = $("fg");
    fg.style.strokeDasharray = CIRC;
    fg.style.strokeDashoffset = CIRC * (1 - (i.sinDiv ? 1 : i.pct / 100));
  }
  function renderHistorial(p) {
    $("hist").innerHTML = p.map((m, k) => `<div class="m ${m.win ? "win" : "loss"} ${claseEtiqueta(m.etiqueta)}" style="animation-delay:${k*.05}s" title="${m.etiqueta}">
      <img src="${m.img}" alt=""></div>`).join("");
  }

</script>
</body>
</html>
